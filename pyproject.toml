[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liteinfer"
version = "0.1.0"
description = "Pure-Python reference kernels for efficient LLM inference: PTQ, paged KV-cache, speculative decoding"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Song Yuchen" }]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
torch = ["torch>=2.14.0"]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy"]

[project.scripts]
liteinfer = "liteinfer.cli:main"

[tool.setuptools.packages.find]
include = ["liteinfer*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E741"]  # ambiguous var name l/O/I — occurs in math-heavy code

[tool.ruff.lint.isort]
known-first-party = ["liteinfer"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_site_packages = true
files = ["liteinfer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["liteinfer"]
omit = ["liteinfer/_version.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
